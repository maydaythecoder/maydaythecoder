name: Generate snake and activity graph
on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: mkdir -p dist && python3 .github/scripts/activity_graph.py dist/activity-graph.svg
      - name: Pick code snippet of the day
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/code_snippet.py dist/code-snippet.svg
      - uses: Platane/snk@v3
        with:
          github_user_name: maydaythecoder
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: actions/upload-artifact@v4
        with:
          name: snake
          path: dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
